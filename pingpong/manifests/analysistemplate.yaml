apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ping-pong-cpu-usage-rate
spec:
  metrics:
    - name: ping-pong-cpu-usage-rate
      initialDelay: 5m
      count: 1
      successCondition: result < 0.5
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local:80
          query: scalar(sum(rate(container_cpu_usage_seconds_total{"namespace"="exercises"}[5m])))