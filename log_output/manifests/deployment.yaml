apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:

      volumes:
        - name: log-output-volume
          emptyDir: {}
        - name: log-output-config
          configMap:
            name: log-output-server-config
            items:
              - key: file-content
                path: content.txt

      containers:
      - name: log-output-server
        image: jukaveyo/log-output-server:4.1.0
        env:
          - name: MESSAGE
            valueFrom:
              configMapKeyRef:
                key: message
                name: log-output-server-config
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 10

        volumeMounts:
        - name: log-output-volume
          mountPath: /usr/src/app/output
        - name: log-output-config
          mountPath: /usr/src/app/files

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
