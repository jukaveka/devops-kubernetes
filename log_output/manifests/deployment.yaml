apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: log-output-volume
          emptyDir: {}
      containers:
      - name: log-output-server
        image: jukaveyo/log-output-server:2.1.2
        volumeMounts:
        - name: log-output-volume
          mountPath: /usr/src/app/output
