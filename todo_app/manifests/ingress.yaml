apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: project
  name: todo-app-ingress
  labels:
    app.kubernetes.io/name: todo-app-ingress
spec:
  rules:
    - host: todo.localhost
      http:
        paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: todo-app-svc
              port: 
                number: 1004
