apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-app-routes
  namespace: project
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: my-gateway
      namespace: gateway-system
  hostnames:
    - "todo.localhost"
  rules:
    - matches:
      - path:
          type: Exact
          value: /
      - path:
          type: PathPrefix
          value: /images
      - path:
          type: Exact
          value: /break
      backendRefs:
        - name: todo-app-svc
          port: 1004