apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-app-public-files
          persistentVolumeClaim:
            claimName: todo-app-claim
      containers:
      - name: todo-app
        image: jukaveyo/todo-app:2.2.4
        volumeMounts:
          - name: todo-app-public-files
            mountPath: /usr/src/app/public