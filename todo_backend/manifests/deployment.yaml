apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-backend
spec:
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
      - name: todo-backend
        image: jukaveyo/todo-backend:4.2.0
        env:
          - name: PORT
            valueFrom:
              configMapKeyRef:
                key: port
                name: todo-backend-config
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                key: postgres_url
                name: todo-backend-secrets

        readinessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 5

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
