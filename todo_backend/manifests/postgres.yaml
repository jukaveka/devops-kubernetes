apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: todo-backend-postgres
spec:
  selector:
    matchLabels:
      app: todo-postgres
  serviceName: todo-db-svc
  replicas: 1
  template:
    metadata:
      labels:
        app: todo-postgres
    spec:
      containers:
      - name: todo-backend-postgres
        image: postgres:14-alpine3.24
 
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: todo-backend-secrets
                key: postgres_password
 
        ports:
          - name: db
            containerPort: 5432
 
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres

  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      storageClassName: local-path
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Mi

---
apiVersion: v1
kind: Service
metadata:
  name: todo-db-svc
  labels:
    app: todo-postgres
spec:
  selector:
    app: todo-postgres
  ports:
  - port: 5432
    name: db
  clusterIP: None
